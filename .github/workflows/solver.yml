name: tests (solver / comprehensive)

# The comprehensive suite: runs the live OpenFUSIONToolkit GS solver
# (reconstruction-free replay + systematics, ~13 min).  It is a PRE-MERGE gate,
# not a per-commit check:
#   * `merge_group`     -> runs once when a PR enters the merge queue, as a
#                          required status check (enable the merge queue +
#                          branch protection on `main` in repo settings).
#   * `workflow_dispatch` -> manual on-demand run.
#
# It runs on the **feynman** self-hosted runner, which has the OFT fork built
# (with the jphi-linterp Ip fixes the solver tests depend on) and the scientific
# Python env.  Register a runner on feynman with the labels [self-hosted,
# feynman], and set the repo variable OFT_PYTHONPATH to the OFT python dir
# (e.g. /path/to/OpenFUSIONToolkit/build_release/python).
on:
  merge_group:
  workflow_dispatch:

concurrency:
  group: solver-${{ github.ref }}
  cancel-in-progress: false   # let an in-flight comprehensive run finish

jobs:
  solver:
    runs-on: [self-hosted, feynman]
    timeout-minutes: 60
    env:
      # Path to the OFT fork's python on feynman (build_release/python).
      # The solver tests also fall back to a sibling OpenFUSIONToolkit checkout.
      OFT_PYTHONPATH: ${{ vars.OFT_PYTHONPATH }}
    steps:
      - uses: actions/checkout@v4

      # --- environment ------------------------------------------------------
      # feynman provides Python 3 + numpy/scipy/h5py/matplotlib + the built OFT
      # fork.  Adapt this step to the cluster (module load / conda activate) if
      # the runner is not already inside the right environment, e.g.:
      #   module load python   &&   conda activate bouquet
      - name: Environment info
        run: |
          python --version
          python -c "import numpy, scipy, h5py, matplotlib; print('sci deps OK')"
          echo "OFT_PYTHONPATH=${OFT_PYTHONPATH:-<unset; using sibling fallback>}"

      - name: Install bouquet (editable) + pytest
        run: pip install -e . pytest

      - name: Sanity — OFT importable
        run: python -c "import OpenFUSIONToolkit; print('OFT', getattr(OpenFUSIONToolkit,'__version__','?'))"

      - name: Run comprehensive solver suite
        run: pytest -m solver -v -s
