[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bouquet"
dynamic = ["version"]   # single source of truth: bouquet.__version__
description = "GP-sampled perturbed equilibria for uncertainty quantification with TokaMaker"
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    # tokamaker here if it becomes pip-installable
]

[project.optional-dependencies]
dev = ["jupyter", "pytest"]

[project.scripts]
plot-family = "bouquet.gui:main"

[tool.setuptools.dynamic]
version = {attr = "bouquet.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
# Default `pytest` runs the FAST suite only (no live solver / OFT).  The
# comprehensive solver suite is run explicitly with `pytest -m solver`
# (and as the pre-merge merge-queue gate in CI).
addopts = "-m 'not solver'"
markers = [
    "solver: integration test that runs the live OpenFUSIONToolkit GS solver (slow ~minutes; needs OFT + the D3D-like mesh). Run with `pytest -m solver`.",
]
